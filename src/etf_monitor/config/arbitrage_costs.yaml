# Creation/redemption cost inputs for the Gate 10 arbitrage band, reviewed 2026-11-05.
#
# creation_unit_shares: Form N-CEN item E.2 "number of ETF shares per creation
#   unit" from the trust's latest N-CEN on EDGAR (filing in `unit_source`).
# creation_fee_usd: standard fixed creation/redemption transaction fee per
#   creation unit from the trust's SAI (485BPOS on EDGAR) where the SAI table
#   lists the fund; otherwise the N-CEN reported average fee per unit for
#   multi-unit orders (`fee_source` says which). Variable charges for cash or
#   non-standard orders (up to 3x the fixed fee) are excluded.
# basket_cost_bps: ASSUMED one-way cost of trading the underlying basket, by
#   asset class. Not observed; see docs/decision-log.md (Gate 10).
# etf_half_spread_bps: ASSUMED ETF half bid-ask spread by asset class (Yahoo
#   has no quotes; the OHLC estimate is reported but too noisy to use).
# stale_nav: NAV is struck from foreign closes before the U.S. close.
